<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Almofadada</title>
<style>
  @font-face{font-family:'Baloo 2';src:url(/fontes/baloo2.woff2) format('woff2');font-weight:400 800;font-display:swap}
  :root{--cor:#2f7df6;--tinta:#fff;--ouro:#ffc531}
  html,body{margin:0;height:100%;background:#0f1220;color:#fff;font-family:'Baloo 2',system-ui,sans-serif;line-height:1.15;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;color:#fff;border:0;padding:0;background:none}
  .ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .moeda{display:inline-block;width:1em;height:1em;border-radius:50%;flex:none;vertical-align:-.14em;background:radial-gradient(circle at 35% 30%,#fff6c2 0 16%,#ffc531 42%,#e09200 100%);box-shadow:inset 0 0 0 .08em #a86400,inset 0 0 0 .2em #ffd968}
  .oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

  /* ---------- escolha do jogador ---------- */
  #escolha{display:flex;flex-direction:column;gap:18px;justify-content:center;align-items:center;height:100%;background:radial-gradient(120% 100% at 50% 0,#27305c,#0f1220 70%)}
  #escolha h1{margin:0;font-size:26px;font-weight:800}
  #escolha .logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;opacity:.85}
  #escolha .logo i{width:34px;height:24px;border-radius:12px 12px 10px 10px;background:linear-gradient(#ff8fb8,#e0457f);box-shadow:inset 0 -4px 0 #0003;position:relative}
  #escolha .logo i::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff8}
  #escolha .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;min-width:0}
  #escolha .tx b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  #escolha .tx small{font-size:15px;font-weight:700;opacity:.8}
  #escolha button.ocupado{filter:saturate(.25) brightness(.6)}
  #escolha .dupla{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:88%}
  #escolha button{flex:1 1 220px;max-width:320px;font-size:26px;font-weight:800;padding:22px 20px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,0) 50%),var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 6px 0 rgba(0,0,0,.5)}
  .carinha{width:1.3em;height:1.3em;border-radius:50%;flex:none;position:relative;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.5),rgba(255,255,255,0) 55%),var(--cor);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  .carinha::before,.carinha::after{content:'';position:absolute;top:26%;width:32%;height:32%;border-radius:50%;background:radial-gradient(circle at 50% 45%,#111 0 34%,#fff 40%)}
  .carinha::before{left:14%}.carinha::after{right:14%}
  #escolha .carinha{--cor:rgba(255,255,255,.18)}
  #escolha button.claro{color:#1a1400}
  #escolha button.claro .carinha{--cor:rgba(0,0,0,.14)}
  #escolha button{flex:1 1 40%;font-size:22px;padding:16px 14px}

  /* ---------- controle ---------- */
  #jogo{display:none;height:100%;flex-direction:column;background:radial-gradient(120% 90% at 50% 100%,#1b2140,#0f1220 70%)}
  #topo{display:flex;align-items:center;gap:8px;padding:3px 10px;font-size:14px;background:linear-gradient(#232a4a,#191e36);border-bottom:1px solid #323a63;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  #topo .carinha{font-size:17px}
  #meuNome{font-size:16px;white-space:nowrap}
  .saldo{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:15px;background:rgba(0,0,0,.4);border:1px solid rgba(255,197,49,.35);border-radius:99px;padding:3px 10px 3px 5px;color:#ffe08a;font-variant-numeric:tabular-nums}
  .saldo.pulsa{animation:pulsa .5s}
  @keyframes pulsa{40%{transform:scale(1.25);background:rgba(255,197,49,.35)}}
  #topo .esp{flex:1;text-align:center;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;letter-spacing:.3px}
  #abrePerfil,#pausar,#reagir{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:6px;min-width:48px;min-height:48px;box-sizing:border-box;background:linear-gradient(#46539a,#343f7c);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:700;box-shadow:0 2px 0 #1b2147}
  #pausar,#reagir{background:linear-gradient(#3a4166,#2a3052);box-shadow:0 2px 0 #141830}
  #reagir{background:linear-gradient(#e0a52e,#b97f10);box-shadow:0 2px 0 #6b4604}
  #pausar:active,#abrePerfil:active,#reagir:active{transform:translateY(2px);box-shadow:none}
  /* na rodada, pausa e perfil pedem segurar 0,5 s: a barra enche enquanto o dedo fica */
  #pausar::after,#abrePerfil::after{content:'';position:absolute;left:0;bottom:0;height:5px;width:0;background:#ffc531}
  #pausar.segura::after,#abrePerfil.segura::after{width:100%;transition:width .5s linear}
  .emoji{font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
  #barraRea{display:none;position:fixed;z-index:8;left:50%;transform:translateX(-50%);top:0;max-width:96vw;box-sizing:border-box;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px;border-radius:18px;background:linear-gradient(#2a3158f5,#171c38f5);border:2px solid #4a58a6;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  #barraRea.on{display:flex}
  #barraRea button{width:52px;height:52px;border-radius:14px;font-size:30px;line-height:1;background:linear-gradient(#3d4780,#2b3360);box-shadow:0 3px 0 #0a0d1a}
  #barraRea button:active{transform:translateY(2px);box-shadow:none}
  .miniRea{display:grid;grid-template-columns:repeat(2,auto);gap:0 6px;height:40px;align-content:center;font-size:17px;line-height:1.15}
  .bolinha.arco{animation:matiz 3s linear infinite}
  @keyframes matiz{to{filter:hue-rotate(360deg)}}
  .novo{display:none;position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:#ff4d5e;border:2px solid #191e36}
  .temPremio .novo{display:block}
  #texto{text-align:center;font-size:20px;font-weight:700;padding:4px 10px;min-height:0}
  .area{flex:1;display:none;align-items:center;justify-content:space-around;min-height:0}
  #base{width:46vmin;height:46vmin;border-radius:50%;background:radial-gradient(circle,#161a2e 0 45%,#252b4a 100%);border:4px solid #3c456f;position:relative;box-shadow:inset 0 6px 16px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.04)}
  #base.ativo{border-color:var(--cor);box-shadow:inset 0 6px 16px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.04),0 0 22px var(--cor)}
  #base{flex:none;margin:auto}
  /* seta de direcao: so aparece com o dedo mexendo, aponta para onde o boneco vai */
  #seta{position:absolute;inset:0;pointer-events:none;opacity:0}
  #seta::after{content:'';position:absolute;left:41%;top:-11%;width:18%;height:13%;background:#fff;filter:drop-shadow(0 0 4px #000);clip-path:polygon(50% 0,100% 100%,0 100%)}
  #base.ativo.mexe #seta{opacity:.85}
  #bola{width:40%;height:40%;border-radius:50%;position:absolute;left:30%;top:30%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.5),rgba(255,255,255,0) 55%),var(--cor);box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 -5px 8px rgba(0,0,0,.3)}
  /* #botoes e a metade direita inteira: qualquer toque ali vale A ou B, pela posicao (ver botaoNaPos) */
  #botoes{flex:0 0 50%;align-self:stretch;display:flex;gap:4vmin;align-items:center;justify-content:center}
  #padrao.semjoy #botoes{flex:1}
  #btA,#btB,#btG{color:var(--tinta);box-shadow:inset 0 -1vmin 0 rgba(0,0,0,.25),0 1.2vmin 0 rgba(0,0,0,.55);transition:transform .05s}
  #btA{width:32vmin;height:32vmin;border-radius:50%;font-size:20px;font-weight:bold;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.4),rgba(255,255,255,0) 50%),var(--cor)}
  #btB{width:24vmin;height:24vmin;border-radius:50%;font-size:17px;font-weight:bold;color:#fff;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.3),rgba(255,255,255,0) 50%),#555c7c}
  #padrao.semjoy #base{display:none}
  #padrao.semjoy #btA,#padrao.semjoy #btB{width:36vmin;height:36vmin}
  #btG{width:86%;height:82%;border-radius:28px;font-size:44px;font-weight:800;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 45%),var(--cor)}
  #btA.ap,#btB.ap,#btG.ap{transform:translateY(.9vmin) scale(.97);box-shadow:inset 0 -.3vmin 0 rgba(0,0,0,.25),0 .3vmin 0 rgba(0,0,0,.55),0 0 0 1.2vmin #fff;filter:brightness(1.3)}
  #pad{width:92%;height:88%;border-radius:24px;background:radial-gradient(circle,#232949,#171b30);border:3px dashed #56609a;position:relative;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#8f98c4;box-shadow:inset 0 6px 18px rgba(0,0,0,.5)}
  #ponto{position:absolute;width:44px;height:44px;border-radius:50%;margin:-22px 0 0 -22px;display:none;pointer-events:none;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.5),rgba(255,255,255,0) 55%),var(--cor);box-shadow:0 0 0 6px rgba(255,255,255,.15),0 4px 10px rgba(0,0,0,.6)}
  #opcoes{flex-wrap:wrap;gap:10px;padding:10px;box-sizing:border-box;align-content:center}
  #opcoes button{flex:1 1 40%;min-height:34%;border-radius:18px;font-size:24px;font-weight:700;background:linear-gradient(#3d4780,#2b3360);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 4px 0 rgba(0,0,0,.5)}
  /* opcoes coloridas em linha (cor-mentirosa): s.coresOp (uma cor por botao) e s.linha */
  #opcoes.linha{flex-wrap:nowrap}
  #opcoes.linha button{flex:1 1 0;min-height:78%;font-size:20px}
  #opcoes button.colorido{background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,0) 50%),var(--bc);color:#10131f;font-weight:900}
  #opcoes button.sel{outline:5px solid #fff;background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,0) 50%),var(--cor);color:var(--tinta)}
  /* menu de modos: so o Jogador 1 (anfitriao) ve, na espera */
  #menu{flex-direction:row;gap:10px;padding:6px 10px 10px;box-sizing:border-box;align-items:stretch;justify-content:stretch}
  /* deitado: 4 colunas; em pe: lista. Cada cartao tem desenho, nome, linha (ou o motivo da trava) e, no escolhido, quantos minijogos tem */
  #menuLista{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  #menuLista button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 6px;border-radius:16px;font-size:20px;font-weight:800;line-height:1.05;text-align:center;
    background:linear-gradient(#3d4780,#2b3360);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 4px 0 rgba(0,0,0,.5);border:3px solid transparent;transition:transform .15s}
  #menuLista svg.des{width:58px;height:34px;fill:currentColor;opacity:.9}
  #menuLista button small{font-size:14px;font-weight:700;opacity:.8}
  #menuLista button .qtd{font-size:13px;opacity:.95}
  #menuLista button .qtd:empty{display:none}
  #menuLista button.sel{border-color:#fff;transform:scale(1.06);background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--cor);color:var(--tinta)}
  #menuLista button.trava{filter:grayscale(1);opacity:.5;box-shadow:none}
  #menuLista button.treme{animation:balanca .2s 2}
  @keyframes balanca{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #menuLado{width:30%;min-width:150px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
  #menuConectados{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center}
  #menuConectados i{font-style:normal;padding:1px 10px 2px;border-radius:99px;font-size:14px;font-weight:800;background:var(--pc);color:var(--pt,#fff);max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #menuConectados i.toca{cursor:pointer;outline:2px dashed #fff8;outline-offset:1px}
  #menuConectados i.par{outline:3px solid #ff7a1a;outline-offset:1px;box-shadow:0 0 0 5px #ff7a1a55}
  #menuDuplaTx{font-size:13px;font-weight:800;text-align:center;color:#ffb37a}
  #menuConectados i.pula{animation:pulinho .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pulinho{40%{transform:translateY(-8px) scale(1.1)}}
  #menuNome{font-size:14px;font-weight:700;color:#ffe08a;text-decoration:underline;padding:2px}
  #menuGo{position:relative;flex:1;border-radius:18px;font-size:28px;font-weight:800;color:#06210f;background:linear-gradient(#7af0a2,#2fbf68);box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 5px 0 #0f6b39;overflow:hidden}
  /* anel da contagem automatica: a borda clara vai esvaziando */
  #menuGo::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:5px;background:conic-gradient(#fff calc(var(--f,0) * 360deg),#0000 0);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  #menuGo:active{transform:translateY(4px);box-shadow:none}
  #menuGo:disabled{filter:saturate(.2) brightness(.6)}
  #menuDica{font-size:14px;font-weight:700;text-align:center;min-height:2.4em;opacity:.9}
  @media (orientation:portrait){ #menu{flex-direction:column} #menuLista{grid-template-columns:1fr} #menuLista button{flex-direction:row;flex-wrap:wrap;gap:2px 10px;justify-content:flex-start;text-align:left} #menuLado{width:auto} #menuGo{min-height:70px} }
  #espera{font-size:22px;text-align:center;padding:0 20px;flex-direction:column;justify-content:center;gap:10px}
  #esperaTx{display:flex;align-items:center;gap:12px;opacity:.85;font-weight:700}
  #esperaTx .carinha{font-size:44px;animation:respira 2s ease-in-out infinite}
  #esperaTx .visto{display:none;width:44px;height:44px;border-radius:50%;background:#35c26b;color:#06210f;place-items:center;animation:mola .5s cubic-bezier(.2,1.8,.4,1)}
  #espera.pronto #esperaTx .visto{display:grid} #espera.pronto #esperaTx .carinha{display:none}
  #esperaTx .visto .ic{width:28px;height:28px;stroke-width:3}
  @keyframes mola{0%{transform:scale(.2)}}
  @keyframes respira{50%{transform:translateY(-5px)}}
  #espera .fila{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  #nomeIni{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:18px;font-weight:800}
  #nomeIni[hidden]{display:none}
  #nomeIni input{width:9em;height:44px;border-radius:12px;border:2px solid #3a4478;background:#12162a;color:#fff;font:800 18px 'Baloo 2',system-ui,sans-serif;text-align:center;user-select:text;-webkit-user-select:text}
  #nomeIni button{height:44px;padding:0 16px;border-radius:12px;font-size:17px;font-weight:800;background:linear-gradient(#45d683,#1fa158);box-shadow:0 3px 0 #0f6a37}
  #nomeIni button.leve{background:none;box-shadow:none;color:#a9b1d8;text-decoration:underline;padding:0 6px}
  #visual{min-height:64px;padding:10px 22px;border-radius:22px;font-size:22px;font-weight:800;background:linear-gradient(#4a58a6,#36418a);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 6px 0 #1b2147}
  #visual:active{transform:translateY(4px);box-shadow:none}
  /* torcer: alvo grande, afunda ao tocar e fica apagado na recarga */
  #torcer{min-width:min(40vw,260px);min-height:64px;padding:10px 28px;border-radius:22px;font-size:26px;font-weight:800;color:#3a2600;
    background:linear-gradient(#ffe07a,#ffb81f);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 6px 0 #a86400;transition:transform .06s,filter .2s}
  /* explicacao do minijogo: nome, dica e o desenho do controle ao lado do botao Entendi */
  #botao.comEx{justify-content:center;gap:4vmin;padding:0 4vmin;box-sizing:border-box}
  #botao.comEx #btG{width:38%;height:76%;font-size:38px}
  #explica{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left}
  #explica[hidden]{display:none}
  #explica small{font-size:15px;font-weight:700;color:#ffe08a}
  #explica b{font-size:30px;font-weight:800;line-height:1}
  #explica p{margin:0;font-size:20px;line-height:1.15;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .fone{display:flex;align-items:center;justify-content:space-around;gap:6px;width:170px;height:62px;margin-top:4px;padding:4px 10px;box-sizing:border-box;border-radius:14px;border:2px solid #56609a;background:#171b30;font-size:12px;font-weight:800}
  .fone .j{width:34px;height:34px;border-radius:50%;border:2px solid #56609a;background:radial-gradient(circle,var(--cor) 0 30%,#0000 32%)}
  .fone .bt{min-width:34px;height:34px;padding:0 6px;border-radius:99px;display:grid;place-items:center;background:var(--cor);color:var(--tinta);white-space:nowrap;overflow:hidden}
  .fone .bt.b{background:#555c7c;color:#fff}
  .fone .op{padding:2px 6px;border-radius:8px;background:#3d4780}
  @media (orientation:portrait){ #botao.comEx{flex-direction:column;padding:10px 6vw} #botao.comEx #btG{width:100%;height:30%} }
  /* pausa no celular: cobre o controle, mas fica abaixo do topo (o botao Tempo segue tocavel) */
  #pausaCel{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;box-sizing:border-box;background:#0f1220f2}
  #pausaCel[hidden]{display:none}
  #pausaCel h2{margin:0;font-size:30px;font-weight:800}
  #pausaCel .acoes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:640px}
  #pausaCel button{position:relative;overflow:hidden;min-height:56px;padding:6px 20px;border-radius:16px;font-size:19px;font-weight:800;background:linear-gradient(#3d4780,#2b3360);box-shadow:0 4px 0 #0a0d1a}
  #pausaCel #continuar{background:linear-gradient(#7af0a2,#2fbf68);color:#06210f;box-shadow:0 4px 0 #0f6b39;font-size:24px;min-width:220px}
  #pausaCel button.perigo{background:linear-gradient(#6a3045,#4a2030)}
  #pausaCel button::after,#trocar::after{content:'';position:absolute;left:0;bottom:0;height:5px;width:0;background:#ffc531}
  #pausaCel button.segura::after,#trocar.segura::after{width:100%;transition:width 1s linear}
  #pausaJ1[hidden]{display:none}
  #torcer.ap{transform:translateY(5px) scale(.97);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 1px 0 #a86400}
  #torcer.recarga{filter:saturate(.3) brightness(.75)}
  #provoca{display:none;justify-content:center;align-items:center;gap:10px;padding:4px 10px 6px}
  #provoca.on{display:flex}
  #provoca span{font-weight:900;font-size:15px;color:#ffe08a}
  #provoca button{width:60px;height:60px;border-radius:16px;font-size:34px;line-height:1;background:linear-gradient(#ffd65a,#e0a52e);box-shadow:0 4px 0 #6b4604;animation:chamaRea 1s ease-in-out infinite alternate}
  #provoca button:active{transform:translateY(3px);box-shadow:0 1px 0 #6b4604}
  @keyframes chamaRea{to{box-shadow:0 4px 0 #6b4604,0 0 16px 3px rgba(255,214,90,.7)}}
  #cartaChip{display:none;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-weight:900;font-size:14px;color:#141a36;white-space:nowrap;background:linear-gradient(#fff,var(--cc,#ffc531));box-shadow:0 0 10px var(--cc,#ffc531)}
  #cartaChip.on{display:inline-flex}
  #opcoes button:active{transform:translateY(3px);filter:brightness(1.2)}
  #opcoes button.carta{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 8px;border:3px solid var(--cc,#ffc531);flex:1 1 28%}
  #opcoes button.carta small{font-size:14px;font-weight:600;opacity:.85;line-height:1.15}
  #opcoes button.carta b{font-size:22px;color:var(--cc,#ffc531)}
  #opcoes button.carta.sel b{color:var(--tinta)}
  #opcoes button.carta ~ button:not(.carta){flex:1 1 100%;min-height:48px;font-size:18px;opacity:.9}

  /* ---------- perfil e loja ---------- */
  #perfil{position:fixed;inset:0;z-index:5;display:none;grid-template-columns:minmax(190px,30%) 1fr;gap:10px;padding:8px;box-sizing:border-box;background:radial-gradient(120% 100% at 0 0,#262e58,#0f1220 70%)}
  #lado{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
  #palco{flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(75% 60% at 50% 40%,#4a57a0,#1a1f3d 80%);border:1px solid #414b88;box-shadow:inset 0 0 30px rgba(0,0,0,.45)}
  #palco.festa{animation:brilho .7s}
  @keyframes brilho{30%{box-shadow:inset 0 0 40px rgba(255,214,90,.9);border-color:var(--ouro)}}
  #previa{position:absolute;inset:0;width:100%;height:100%}
  #saldoPerfil{position:absolute;left:8px;top:8px;font-size:17px}
  #tagPrevia{display:none;position:absolute;right:8px;top:8px;align-items:center;gap:4px;font-size:12px;font-weight:700;background:#7fb0ff;color:#0d1330;border-radius:99px;padding:3px 9px}
  .vendoPrevia #tagPrevia{display:flex}
  #barraPrevia{display:none;gap:6px}
  .vendoPrevia #barraPrevia{display:flex}
  #comprar{flex:1;height:40px;border-radius:12px;font-size:16px;font-weight:800;color:#3a2600;display:flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(#ffe07a,#ffb81f);box-shadow:0 3px 0 #a86400;animation:chama 1.2s ease-in-out infinite}
  @keyframes chama{50%{filter:brightness(1.15)}}
  #comprar.nao{background:#2a3052;color:#ff9aa5;box-shadow:0 3px 0 #141830;animation:none}
  #sairPrevia{width:40px;height:40px;border-radius:12px;background:#2a3052;box-shadow:0 3px 0 #141830;display:grid;place-items:center;font-size:16px}
  #placa{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-radius:12px;background:#12162a;border:2px solid #3a4478;color:#8f98c4;box-sizing:border-box}
  #placa:focus-within{border-color:var(--ouro);color:var(--ouro)}
  #nome{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:#fff;font:800 18px 'Baloo 2',system-ui,sans-serif;text-align:center;user-select:text;-webkit-user-select:text}
  #nome::placeholder{color:#5d668f;font-weight:600}
  #conta{font-size:11px;font-variant-numeric:tabular-nums}
  #trocar{position:relative;overflow:hidden;align-self:center;display:flex;align-items:center;gap:5px;font-size:12px;color:#8f98c4;padding:3px 10px}
  #direita{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
  #cabeca{display:flex;gap:8px;align-items:center}
  #abas{flex:1;display:flex;gap:3px;padding:3px;min-width:0;background:#12162a;border-radius:12px}
  .aba{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:700;color:#8f98c4;position:relative}
  .aba.ativa{background:linear-gradient(#4a58a6,#36418a);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 0 #1b2147}
  .aba .novo{top:4px;right:6px;border-color:#12162a}
  #fechar{height:48px;padding:0 16px;border-radius:12px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px;background:linear-gradient(#45d683,#1fa158);box-shadow:0 3px 0 #0f6a37}
  #fechar:active,.item:active,#comprar:active{transform:translateY(2px)}
  #paineis{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x pan-y;scrollbar-width:none;border-radius:14px;background:rgba(10,13,28,.55);border:1px solid #2b3360}
  #paineis::-webkit-scrollbar{display:none}
  .painel{flex:0 0 100%;min-width:0;scroll-snap-align:start;overflow-y:auto;touch-action:pan-x pan-y;box-sizing:border-box;padding:8px}
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
  .cartao{position:relative}
  .item{width:100%;height:102px;border-radius:14px;box-sizing:border-box;border:2px solid #39427a;background:linear-gradient(#2a325c,#1d2344);box-shadow:0 3px 0 #0a0d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;font-size:12px;font-weight:600}
  .item.sel{border-color:var(--ouro);background:linear-gradient(#4a4424,#2c2a1c);box-shadow:0 0 0 2px rgba(255,197,49,.3),0 3px 0 #0a0d1a}
  .item.vendo{border-color:#7fb0ff;box-shadow:0 0 0 2px rgba(127,176,255,.35),0 3px 0 #0a0d1a}
  .item.falta{background:#171b33;border-color:#262c50;color:#7d86b0}
  .item.falta .bolinha,.item.falta .mini{filter:grayscale(.55) brightness(.6)}
  .bolinha{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%),var(--c);box-shadow:inset 0 -4px 6px rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.15)}
  .mini{width:56px;height:40px}
  .etq{display:flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:99px;font-size:12px;font-weight:800;background:rgba(0,0,0,.4);white-space:nowrap}
  .item.compra .etq{color:#ffe08a}
  .item.sel .etq{background:var(--ouro);color:#3a2600}
  .item.falta .etq{color:#ff9aa5;font-size:11px;padding:0 6px;gap:3px}
  .olho{position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;background:rgba(8,10,24,.7);color:#cfe0ff;display:grid;place-items:center;font-size:14px}
  .vendo + .olho{background:#7fb0ff;color:#0d1330}

  /* ---------- trofeus ---------- */
  #resumo{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .num{flex:1 1 62px;background:#1d2344;border:1px solid #333c70;border-radius:12px;padding:5px 4px;text-align:center;font-size:10px;color:#a9b1d8;line-height:1.2}
  .num b{display:block;font-size:18px;color:#fff}
  #melhor{flex:1 1 100%;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#3a3a24,#1d2344);border:1px solid #6d6230;border-radius:12px;padding:7px 10px;font-size:13px;color:#e9dfb5}
  #melhor .ic{color:var(--ouro);font-size:18px}
  #melhor b{color:#fff}
  #trofeus{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:8px}
  .trofeu{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 8px;border-radius:14px;box-sizing:border-box;width:100%;background:#1a1f3d;border:2px solid #2b3360;font-size:12px;color:#fff}
  .selo{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;background:#262c50;color:#6f78a6;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
  .ganho .selo,.pegar .selo,#aviso .selo{background:radial-gradient(circle at 35% 28%,#fff3b0,#ffc531 45%,#d98a00);color:#5a3a00}
  .trofeu .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .trofeu .tx b{font-size:13px}
  .trofeu .tx small{color:#a9b1d8;font-size:11px}
  .barra{height:6px;border-radius:99px;background:#0d1024;overflow:hidden;margin-top:2px}
  .barra i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4f8dff,#7fd0ff)}
  .ganho .barra i,.pegar .barra i{background:linear-gradient(90deg,#ffb81f,#ffe07a)}
  .premio{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-weight:800;font-size:12px;color:#ffe08a;font-variant-numeric:tabular-nums}
  .premio em{font-style:normal;color:#a9b1d8;font-weight:600}
  .premio span{display:flex;align-items:center;gap:3px}
  .ganho{border-color:#6d6230}
  .ganho .premio{color:#7fe0a5}
  .pegar{border-color:var(--ouro);background:linear-gradient(#4a4424,#2c2a1c);animation:chama 1.2s ease-in-out infinite}
  .pegar .premio{align-items:center;background:linear-gradient(#ffe07a,#ffb81f);color:#3a2600;border-radius:10px;padding:4px 10px;box-shadow:0 2px 0 #a86400}

  /* ---------- avisos ---------- */
  .voa{position:fixed;z-index:30;pointer-events:none;font-weight:900;font-size:22px;color:#ffe07a;text-shadow:0 2px 0 #7a4a00,0 0 10px rgba(0,0,0,.8);animation:voa 1.3s ease-out forwards;white-space:nowrap}
  .voa.menos{color:#ff9aa5;text-shadow:0 2px 0 #6a0f1a,0 0 10px rgba(0,0,0,.8)}
  @keyframes voa{0%{transform:translateY(14px) scale(.6);opacity:0}20%{transform:translateY(0) scale(1.15);opacity:1}100%{transform:translateY(-34px);opacity:0}}
  #aviso{position:fixed;z-index:20;left:50%;top:8px;transform:translate(-50%,-140%);transition:transform .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;display:flex;align-items:center;gap:10px;max-width:92vw;box-sizing:border-box;padding:8px 16px 8px 8px;border-radius:99px;background:linear-gradient(#3b3520,#211f14);border:2px solid var(--ouro);box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 20px rgba(255,197,49,.35)}
  #aviso.on{transform:translate(-50%,0)}
  #aviso .tx{display:flex;flex-direction:column;line-height:1.2;min-width:0}
  #aviso small{font-size:12px;color:var(--ouro);font-weight:800}
  #aviso b{font-size:16px;white-space:nowrap}
  #aviso span span{font-size:12px;color:#e9dfb5}

  @media (max-width:480px){ #abrePerfil span,#pausar span{display:none} #abrePerfil,#pausar,#reagir{padding:6px 9px;font-size:16px} #fechar{padding:0 12px} .aba{font-size:13px} }
  @media (orientation:portrait){ #perfil{grid-template-columns:1fr;grid-template-rows:minmax(230px,42%) 1fr} 
    /* em pe: joystick embaixo a esquerda, botoes empilhados embaixo a direita (dois polegares) */
    #base{align-self:flex-end;margin:0 auto 9vh}
    #botoes{flex-direction:column;justify-content:flex-end;padding-bottom:5vh;box-sizing:border-box}
    #btA{width:40vmin;height:40vmin} #btB{width:30vmin;height:30vmin}
    #padrao.semjoy #btA,#padrao.semjoy #btB{width:40vmin;height:40vmin}
  }
</style>
</head>

<script>

const $ = id => document.getElementById(id);

// Vibra o celular. Android: API de vibracao (vale depois do primeiro toque na pagina). iPhone nao tem essa API:
// o Safari 18 da um toque haptico ao virar um "switch", mas so durante um toque do dedo; o resto vira um clarao na borda.
const temVibracao = typeof navigator.vibrate === 'function';
function treme(padrao, forte = false, daRede = false) {
  const lista = (Array.isArray(padrao) ? padrao : [padrao]).slice(0, 10).map(v => Math.max(0, Math.min(1000, Number(v) || 0)));
  if (temVibracao) { try { navigator.vibrate(lista); } catch {} }
  else $('haptico').click();
  // clarao na borda: sempre em pancada forte; no iPhone tambem nas fracas (o haptico la so vale com o dedo na tela)
  if (forte || (daRede && !temVibracao)) $('flash').animate([{ opacity: forte ? 1 : 0.45 }, { opacity: 0 }], { duration: forte ? 380 : 240, easing: 'ease-out' });
}

const ic = nome => `<svg class="ic"><use href="#i-${nome}"/></svg>`;
const MOEDA = '<i class="moeda"></i>';
function guarda(chave, v) { try { localStorage.setItem(chave, JSON.stringify(v)); } catch {} }
function le(chave) { try { return JSON.parse(localStorage.getItem(chave)); } catch { return null; } }

// ---------- estado enviado para a tela ----------
// j: jogador; x/y: joystick ou toque; d/n: botao A e contador; b/nb: botao B; op/nop: escolha na tela do celular; r/nr: reacao; nt: torcida.
// Os contadores garantem que toque curto nunca se perde.
let j = 0, x = 0, y = 0, d = false, n = 0, b = false, nb = 0, op = -1, nop = 0, r = -1, nr = 0, nt = 0;      // r/nr: reacao (indice) e contador; nt: torcida
let perfil = null, modo = '';
let aberto = false, previa = null;      // perfil aberto; item sendo experimentado { campo, i }

// Um envio por vez: enquanto um esta a caminho, o proximo espera e leva o estado mais novo.
let enviando = false, pendente = false, ultimo = 0;
// Caminho rapido: WebSocket (conexao aberta, sem cabecalho por mensagem, tudo em ordem).
// Se nao conectar, cai no POST, um envio por vez.
let ws = null;
function conectaWs() {
  try { ws = new WebSocket(`ws://${location.host}/ws`); } catch { ws = null; return; }
  ws.onopen = () => envia();
  ws.onclose = () => { ws = null; setTimeout(conectaWs, 1000); };
  ws.onerror = () => {};
}
conectaWs();

const SESSAO = Date.now();   // hora em que esta aba abriu: com duas abas no mesmo jogador, vale a mais nova
let seq = 0;
function envia() {
  if (!j) return;
  if (ws?.readyState === 1) { ultimo = Date.now(); ws.send(JSON.stringify({ j, x, y, d, n, b, nb, op, nop, r, nr, nt, s: SESSAO, q: ++seq })); return; }
  if (enviando) { pendente = true; return; }
  enviando = true; pendente = false; ultimo = Date.now();
  fetch('/in', { method: 'POST', body: JSON.stringify({ j, x, y, d, n, b, nb, op, nop, r, nr, nt, s: SESSAO, q: ++seq }), signal: AbortSignal.timeout(1000) })
    .catch(() => {})
    .finally(() => { enviando = false; if (pendente) envia(); });
}
setInterval(() => { if (Date.now() - ultimo > 400) envia(); }, 200);   // sinal de vida

// ---------- moedas: #moedas tem o saldo real na hora; o numero visivel sobe ou desce contando ----------
let mostrado = null, animMoedas = 0;
function mostraMoedas() {
  $('moedas').textContent = perfil.moedas;
  cancelAnimationFrame(animMoedas);
  const de = mostrado ?? perfil.moedas, para = perfil.moedas, t0 = performance.now();
  const pinta = v => { mostrado = v; $('moedasVis').textContent = $('saldo').textContent = milhar(v); };
  if (de === para) return pinta(para);
  for (const id of ['saldoTopo', 'saldoPerfil']) { $(id).classList.remove('pulsa'); void $(id).offsetWidth; $(id).classList.add('pulsa'); }
  const passo = agora => {
    const q = Math.min(1, (agora - t0) / 700);
    pinta(Math.round(de + (para - de) * (1 - (1 - q) ** 3)));
    if (q < 1) animMoedas = requestAnimationFrame(passo);
  };
  animMoedas = requestAnimationFrame(passo);
}
function flutua(txt) {                  // "+10" subindo ao lado do saldo
  const r = $(aberto ? 'saldoPerfil' : 'saldoTopo').getBoundingClientRect();
  const s = document.createElement('div');
  s.className = 'voa' + (txt[0] === '-' ? ' menos' : '');
  s.textContent = txt;
  s.style.left = r.left + 8 + 'px'; s.style.top = r.bottom + 4 + 'px';
  s.onanimationend = () => s.remove();
  document.body.append(s);
}

const filaAvisos = [];
let avisando = false;
function aviso(icone, nome, txt) { filaAvisos.push([icone, nome, txt]); if (!avisando) proximoAviso(); }
function proximoAviso() {
  const a = filaAvisos.shift();
  avisando = !!a;
  if (!a) return;
  $('avisoIc').setAttribute('href', '#i-' + a[0]); $('avisoNome').textContent = a[1]; $('avisoTx').textContent = a[2];
  $('aviso').classList.add('on');
  setTimeout(() => { $('aviso').classList.remove('on'); setTimeout(proximoAviso, 400); }, 2800);
}

// ---------- perfil, loja e trofeus ----------
function confereTrofeus() {             // 1 = conquistado, falta pegar o bonus; 2 = bonus recebido
  for (const [id, icone, nome, , meta, bonus, valor] of TROFEUS)
    if (!perfil.trofeus[id] && valor(perfil.est) >= meta) {
      perfil.trofeus[id] = 1;
      aviso(icone, nome, `Tem ${bonus} moedas te esperando em Troféus`);
      treme([40, 40, 120]);
    }
  document.body.classList.toggle('temPremio', Object.values(perfil.trofeus).includes(1));
}

function salvaPerfil() {
  confereTrofeus();
  guarda('perfil' + j, perfil);
  const cor = (CORES[perfil.cor] ?? CORES[j - 1])[0];
  const [r, g, az] = [1, 3, 5].map(k => parseInt(cor.slice(k, k + 2), 16));
  const raiz = document.documentElement.style;
  raiz.setProperty('--cor', cor);
  raiz.setProperty('--tinta', r * 299 + g * 587 + az * 114 > 160000 ? '#111' : '#fff');   // letra escura em cor clara
  $('meuNome').textContent = perfil.nome || 'Jogador ' + j;
  mostraMoedas();
  if (aberto) { desenhaLoja(); desenhaTrofeus(); }
  fetch('/perfil', { method: 'POST', body: JSON.stringify({ j, nome: perfil.nome, cor: perfil.cor, chapeu: perfil.chapeu }) }).catch(() => {});
}

// Um toque no cartao: usa se ja tem, compra e usa se o saldo da, senao mostra a previa com quanto falta.
function toca(campo, i) {
  const [lista, donos] = LOJAS[campo], preco = lista[i][1];
  if (!perfil[donos].includes(i)) {
    if (perfil.moedas < preco) return vePrevia(campo, i);
    perfil.moedas -= preco; perfil[donos].push(i);
    flutua('-' + preco); festa();
  }
  previa = null; if (campo !== 'reacao') perfil[campo] = i; salvaPerfil(); mostraPrevia();
}
function vePrevia(campo, i) {
  previa = previa?.campo === campo && previa.i === i ? null : { campo, i };
  mostraPrevia(); desenhaLoja();
}
function mostraPrevia() {
  $('perfil').classList.toggle('vendoPrevia', !!previa);
  if (!previa) return;
  const falta = LOJAS[previa.campo][0][previa.i][1] - perfil.moedas;
  $('comprar').className = falta > 0 ? 'nao' : '';
  $('comprar').innerHTML = falta > 0 ? `${ic('cadeado')}Faltam ${MOEDA}${falta}` : `Levar por ${MOEDA}${falta + perfil.moedas}`;
}
$('comprar').onclick = () => { if (previa && !$('comprar').className) toca(previa.campo, previa.i); };
$('sairPrevia').onclick = () => { previa = null; mostraPrevia(); desenhaLoja(); };

function loja(campo) {
  const [lista, donos, idGrade] = LOJAS[campo], grade = $(idGrade);
  grade.textContent = '';
  lista.forEach(([rotulo, preco], i) => {
    const tem = perfil[donos].includes(i), usando = perfil[campo] === i, falta = preco - perfil.moedas;
    const vendo = previa?.campo === campo && previa.i === i;
    const cartao = document.createElement('div'), bt = document.createElement('button');
    cartao.className = 'cartao';
    bt.className = 'item' + (usando ? ' sel' : '') + (tem ? '' : falta > 0 ? ' falta' : ' compra') + (vendo ? ' vendo' : '');
    const nome = document.createElement('span'), etq = document.createElement('span');
    if (campo === 'cor') {
      const bola = document.createElement('span');
      bola.className = 'bolinha' + (i === 11 ? ' arco' : ''); bola.style.setProperty('--c', rotulo);
      if (CORES[i][2]) bola.style.background = `radial-gradient(circle at 35% 28%,rgba(255,255,255,.45),rgba(255,255,255,0) 55%),${CORES[i][2]}`;
      bt.append(bola); nome.textContent = NOMES_CORES[i];
    } else if (campo === 'reacao') {
      const fila = document.createElement('span');
      fila.className = 'miniRea emoji';
      for (const k of PACOTES[i][2]) { const e = document.createElement('span'); e.textContent = REACOES[k][0]; fila.append(e); }
      bt.append(fila); nome.textContent = rotulo;
    } else { bt.append(miniChapeu(i)); nome.textContent = rotulo; }
    etq.className = 'etq';
    etq.innerHTML = usando ? ic('check') + 'Vestindo' : tem ? (campo === 'reacao' ? ic('check') + 'É seu' : 'Vestir') : falta > 0 ? `Faltam ${MOEDA}${falta}` : MOEDA + preco;
    bt.append(nome, etq);
    bt.onclick = () => toca(campo, i);
    cartao.append(bt);
    if (!tem && campo !== 'reacao') {   // olho: experimenta no personagem sem comprar
      const olho = document.createElement('button');
      olho.className = 'olho'; olho.innerHTML = ic('olho');
      olho.setAttribute('aria-label', 'Ver ' + nome.textContent + ' no personagem');
      olho.onclick = () => vePrevia(campo, i);
      cartao.append(olho);
    }
    grade.append(cartao);
  });
}
function desenhaLoja() { loja('cor'); loja('chapeu'); loja('reacao'); }

function desenhaTrofeus() {
  const e = perfil.est, resumo = $('resumo'), lista = $('trofeus');
  const ganhos = Object.keys(perfil.trofeus).length;
  resumo.innerHTML = [[milhar(e.vitorias), 'rodadas ganhas'], [milhar(e.partidas), 'partidas ganhas'], [milhar(e.seq), 'sequência agora'], [milhar(e.maiorSeq), 'melhor sequência'], [milhar(e.empates), 'empates'], [`${ganhos}/${TROFEUS.length}`, 'troféus']]
    .map(([v, t]) => `<div class="num"><b>${v}</b>${t}</div>`).join('') + `<div id="melhor">${ic('trofeu')}<span></span></div>`;
  // so entra minijogo com nome de verdade: nome que parece id de arquivo (corrida-dedos) ou vazio fica de fora da frase
  const melhor = Object.values(e.porJogo).filter(v => Array.isArray(v) && typeof v[0] === 'string' && v[0] && !pareceId(v[0])).sort((a, b) => b[1] - a[1])[0];
  const frase = resumo.querySelector('#melhor span');
  if (melhor) {
    const forte = document.createElement('b');
    forte.textContent = textoSeguro(melhor[0], 30);
    frase.append('Você manda bem em ', forte, melhor[1] === 1 ? ' (1 vitória)' : ` (${milhar(melhor[1])} vitórias)`);
  } else frase.textContent = 'Ganhe uma rodada e a gente descobre seu forte';
  lista.textContent = '';
  for (const [id, icone, nome, desc, meta, bonus, valor] of TROFEUS) {
    const estado = perfil.trofeus[id] | 0, v = Math.max(0, Math.min(meta, valor(e) | 0));
    const t = document.createElement(estado === 1 ? 'button' : 'div');
    t.className = 'trofeu' + ['', ' pegar', ' ganho'][estado];
    t.innerHTML = `<span class="selo">${ic(icone)}</span><span class="tx"><b>${nome}</b><small>${desc}</small><span class="barra"><i style="width:${v / meta * 100}%"></i></span></span><span class="premio">`
      + (estado === 2 ? `<span>${ic('check')}Guardado</span>` : estado === 1 ? `Pegar<span>${MOEDA}+${bonus}</span>` : `<em>${v}/${meta}</em><span>${MOEDA}${bonus}</span>`) + '</span>';
    if (estado === 1) t.onclick = () => {
      perfil.trofeus[id] = 2; perfil.moedas += bonus; perfil.est.ganho += bonus;
      flutua('+' + bonus); festa(); salvaPerfil();
    };
    lista.append(t);
  }
}

// abas: os tres paineis ficam lado a lado e deslizam (toque na aba ou arrastando para o lado)
const paineis = $('paineis'), abas = [...document.querySelectorAll('.aba')];
abas.forEach((a, i) => { a.onclick = () => paineis.scrollTo({ left: i * paineis.clientWidth, behavior: 'smooth' }); });
paineis.addEventListener('scroll', () => {
  const atual = Math.round(paineis.scrollLeft / paineis.clientWidth);
  abas.forEach((a, i) => a.classList.toggle('ativa', i === atual));
});

  $('nome').value = perfil.nome; $('nome').oninput();
  fechaBarra(); previa = null; aberto = true; mostraPrevia();
  $('perfil').style.display = 'grid';
  desenhaLoja(); desenhaTrofeus(); mostraMoedas(); soltaTudo();
  requestAnimationFrame(quadro);
}
seguraNaRodada($('abrePerfil'), abreLoja);
$('visual').onclick = abreLoja;
$('menuNome').onclick = abreLoja;
$('fechar').onclick = () => {
  perfil.nome = $('nome').value.trim().slice(0, 10);
  aberto = false; previa = null; $('nome').blur();
  salvaPerfil(); $('perfil').style.display = 'none';
};
// reacoes: o botao de carinha esta sempre no topo; a barra mostra so o que o jogador tem e fecha ao tocar
const barraRea = $('barraRea');
function minhasReacoes() { return [...GRATIS, ...PACOTES.flatMap((p, i) => perfil.pacotes.includes(i) ? p[2] : [])]; }
function fechaBarra() { barraRea.classList.remove('on'); $('reagir').setAttribute('aria-expanded', 'false'); }
function reage(k) {
  r = k; nr++; treme(20);
  perfil.est.reacoes++; confereTrofeus(); guarda('perfil' + j, perfil);       // sem salvaPerfil: ele reenvia o perfil e a tela refaria o boneco
  if (aberto) desenhaTrofeus();
  fechaBarra(); envia();
}
$('reagir').onclick = () => {
  if (barraRea.classList.contains('on')) return fechaBarra();

// a tela do PC alterna a pausa: um toque pausa, outro continua
// Na rodada, pausa e perfil pedem segurar 0,5 s (toque sem querer nao pega); fora da rodada, um toque basta.
function seguraNaRodada(el, acao) {
  let timer = 0, agiu = false;       // agiu: o timer ja fez a acao; o click de soltar logo depois nao age de novo
  const para = () => { clearTimeout(timer); timer = 0; el.classList.remove('segura'); };
  el.addEventListener('pointerdown', e => {
    agiu = false;
    if (!jogando) return;
    e.preventDefault(); el.classList.add('segura');
    timer = setTimeout(() => { para(); agiu = true; acao(); }, 500);
  });
  for (const tipo of ['pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(tipo, para);
  el.addEventListener('click', () => { if (agiu) { agiu = false; return; } if (!jogando) acao(); });
}
seguraNaRodada($('pausar'), () => { fetch('/pausa', { method: 'POST', body: JSON.stringify({ j }) }).catch(() => {}); });
// Segurar 1 s (barra enchendo) para acoes que nao tem volta: mudar de lugar, recomecar, voltar ao menu
function segura1s(el, acao) {
  let timer = 0;
  const para = () => { clearTimeout(timer); timer = 0; el.classList.remove('segura'); };
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('segura'); timer = setTimeout(() => { para(); treme([40, 40, 120]); acao(); }, 1000); });
  for (const tipo of ['pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(tipo, para);
}
segura1s($('trocar'), () => { try { localStorage.removeItem('slot'); } catch {} location.reload(); });

function premia(premio) {       // cada premio tem um id; so conta uma vez
  if (!premio?.id || perfil.premios.includes(premio.id)) return;
  perfil.premios = [...perfil.premios, premio.id].slice(-40);
  const valor = Math.max(0, Math.min(200, premio.valor | 0)), e = perfil.est;
  perfil.moedas += valor; e.ganho += valor; e.rodadas++;
  if (premio.venceu) {
    e.vitorias++; e.seq++; e.maiorSeq = Math.max(e.maiorSeq, e.seq);
    if (/^[a-z0-9-]{1,30}$/.test(premio.jogo)) {     // id vem da rede: so o formato dos arquivos de minijogo; sem nome de verdade, guarda vazio (conta, mas nao aparece)
      const nm = textoSeguro(premio.nomeJogo, 30);
      e.porJogo[premio.jogo] = [nm && !pareceId(nm) ? nm : '', (e.porJogo[premio.jogo]?.[1] | 0) + 1];
    }
  } else if (premio.empate) e.empates++;
  else e.seq = 0;                                   // empate nao quebra a sequencia, derrota sim
  if (premio.partida) e.partidas++;
  if (valor) flutua('+' + valor);         // a vibracao de vitoria ou derrota vem da tela (vib), nao daqui
  salvaPerfil();
}

  c.beginPath();

  document.documentElement.requestFullscreen?.().catch(() => {});
  const es = new EventSource('/eventos-c?j=' + j);
  es.onmessage = e => { try { aplica(JSON.parse(e.data)); } catch {} };
  es.onopen = () => { vibBase = false; salvaPerfil(); };     // (re)conectou: o estado que chega e base, e o servidor recebe o perfil de novo
  envia();
}

// ---------- joystick ----------
// Joystick flutuante: nasce onde o dedo encosta (em qualquer lugar da area, fora dos botoes), entao nao precisa
// olhar para o celular para achar o centro. Se o dedo passa da borda, o centro vai junto.
const base = $('base'), seta = $('seta'), bola = $('bola'), areaPadrao = $('padrao');
// @puras (funcoes sem DOM: o teste le este trecho do html)
const ZONA_MORTA = 0.1;
// len: distancia do dedo ao centro, 0 a 1. Depois da zona morta, mistura de linear e quadratica: movimento pequeno
// fica preciso, e empurrar ate o fim (len 1) continua dando 1. A diagonal usa o mesmo modulo, entao tambem chega a 1.
function forcaJoystick(len) {
  if (len < ZONA_MORTA) return 0;
  const f = Math.min(1, (len - ZONA_MORTA) / (1 - ZONA_MORTA));
  return 0.4 * f + 0.6 * f * f;
}
// Qual botao fica mais perto do toque (px, py)? ca e cb sao os centros de A e B. Sem B (ou sem A), a area toda vale o que existe;
// sem nenhum dos dois, null (nada conta). Com `atual` (o botao em que o dedo ja esta) ha histerese: so troca quando o dedo passa
// 18% da distancia entre os centros alem da divisa (a diferenca das distancias e o dobro disso), entao dedo parado ou esfregando na divisa nao alterna.
function botaoNaPos(px, py, ca, cb, temA = true, temB = true, atual = null) {
  if (!temA && !temB) return null;
  if (!temB) return 'A';
  if (!temA) return 'B';
  const dA = Math.hypot(px - ca.x, py - ca.y), dB = Math.hypot(px - cb.x, py - cb.y);
  if (atual === 'A' || atual === 'B') {
    const dAtual = atual === 'A' ? dA : dB, dOutro = atual === 'A' ? dB : dA;
    return dAtual - dOutro > 0.36 * Math.hypot(ca.x - cb.x, ca.y - cb.y) ? (atual === 'A' ? 'B' : 'A') : atual;
  }
  return dA <= dB ? 'A' : 'B';
}
// @fim-puras
// @puras-texto (funcoes sem DOM: o tela.test.mjs le este trecho)
const CRU = /\[object \w+\]|\b(?:undefined|NaN|null)\b/g;
function textoSeguro(s, max = 120) { if (typeof s === 'number') return Number.isFinite(s) ? s.toLocaleString('pt-BR') : ''; if (typeof s !== 'string') return ''; return s.replace(CRU, ' ').replace(/\s+/g, ' ').trim().slice(0, max); }
const milhar = n => (Number.isInteger(n) ? n : 0).toLocaleString('pt-BR');
const pareceId = s => typeof s === 'string' && /^[a-z0-9-]+$/.test(s);
// @fim-puras-texto
const bordaJoy = { x: false };       // dedo na borda: vibra uma vez por chegada
let dedo = null, origem = null, casa = null;      // origem: centro atual; casa: centro de repouso do desenho
function mover(t) {
  const raio = base.offsetWidth / 2;
  let dx = t.clientX - origem.x, dy = t.clientY - origem.y;
  const dist = Math.hypot(dx, dy);
  if (dist > raio) {                       // arrasta o centro atras do dedo
    origem.x += dx / dist * (dist - raio); origem.y += dy / dist * (dist - raio);
    dx = dx / dist * raio; dy = dy / dist * raio;
  }
  const len = Math.min(1, dist / raio);
  const forca = forcaJoystick(len);       // tremor do dedo parado nao anda
  if (len >= 0.98 && !bordaJoy.x) { bordaJoy.x = true; treme(10); } else if (len < 0.8) bordaJoy.x = false;
  const k = len ? forca / len : 0;
  x = Math.round(dx / raio * k * 1000) / 1000; y = Math.round(dy / raio * k * 1000) / 1000;
  base.style.transform = `translate(${origem.x - casa.x}px, ${origem.y - casa.y}px)`;
  bola.style.transform = `translate(${dx / raio * 75}%, ${dy / raio * 75}%)`;
  base.classList.toggle('mexe', forca > 0);
  if (forca > 0) seta.style.transform = `rotate(${Math.atan2(dy, dx) + Math.PI / 2}rad)`;
  envia();
}
function soltaJoystick() {
  dedo = null; x = y = 0;
  bola.style.transform = ''; base.style.transform = ''; base.classList.remove('ativo', 'mexe'); bordaJoy.x = false;
  envia();
}
areaPadrao.addEventListener('touchstart', e => {
  if (e.target.closest('#botoes')) return;   // botoes A e B cuidam de si
  e.preventDefault();
  if (dedo !== null || !base.offsetWidth) return;   // sem joystick na tela, ou segundo dedo (ou a palma) nao rouba o joystick
  const t = e.changedTouches[0], r = base.getBoundingClientRect();
  if (!base.style.transform) casa = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  casa ??= { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  dedo = t.identifier; origem = { x: t.clientX, y: t.clientY };
  base.classList.add('ativo'); mover(t);
});
areaPadrao.addEventListener('touchmove', e => { for (const t of e.changedTouches) if (t.identifier === dedo) { mover(t); e.preventDefault(); } });
for (const tipo of ['touchend', 'touchcancel'])
  areaPadrao.addEventListener(tipo, e => { for (const t of e.changedTouches) if (t.identifier === dedo) soltaJoystick(); });

// ---------- botoes A (normal e gigante) e B ----------
function botao(el, aperta, solta) {
  el.addEventListener('touchstart', e => { aperta(); el.classList.add('ap'); treme(30); envia(); e.preventDefault(); });
  for (const tipo of ['touchend', 'touchcancel'])
    el.addEventListener(tipo, e => { if (!e.targetTouches.length) { solta(); el.classList.remove('ap'); } envia(); e.preventDefault(); });
}
botao($('btG'), () => { d = true; n++; }, () => { d = false; });
// A e B no modo padrao: a metade direita inteira (#botoes) e area de toque, dividida pela posicao. Cada dedo guarda o botao em que esta;
// deslizar de um para o outro (com histerese) solta um e aperta o outro. Sem joystick (semjoy: corrida-dedos, pula-corda, domino) os botoes
// se alternam e deslizar NAO troca de botao: cada aperto exige tirar o dedo e tocar de novo.
const zonaBotoes = $('botoes'), dedosBotao = new Map();       // identifier do toque -> 'A' | 'B'
const centro = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
function botaoDoToque(t, atual = null) {
  const vivo = el => getComputedStyle(el).visibility !== 'hidden';
  return botaoNaPos(t.clientX, t.clientY, centro($('btA')), centro($('btB')), vivo($('btA')), vivo($('btB')), atual);
}
function pintaBotoes() {
  const vals = [...dedosBotao.values()];
  d = vals.includes('A'); b = vals.includes('B');
  $('btA').classList.toggle('ap', d); $('btB').classList.toggle('ap', b);
}
function apertou(qual) { if (qual === 'A') n++; else nb++; treme(30); }
zonaBotoes.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) { const q = botaoDoToque(t); if (!q) continue; dedosBotao.set(t.identifier, q); apertou(q); }
  pintaBotoes(); envia();
});
zonaBotoes.addEventListener('touchmove', e => {
  e.preventDefault();
  if ($('padrao').classList.contains('semjoy')) return;      // botoes que se alternam: deslizar nao troca, tira o dedo e toca de novo
  let mudou = false;
  for (const t of e.changedTouches) {
    if (!dedosBotao.has(t.identifier)) continue;
    const q = botaoDoToque(t, dedosBotao.get(t.identifier));
    if (!q) { dedosBotao.delete(t.identifier); mudou = true; }      // os botoes sumiram com o dedo na area: solta, sem contar aperto
    else if (q !== dedosBotao.get(t.identifier)) { dedosBotao.set(t.identifier, q); apertou(q); mudou = true; }
  }
  if (mudou) { pintaBotoes(); envia(); }
});
for (const tipo of ['touchend', 'touchcancel'])
  zonaBotoes.addEventListener(tipo, e => {
    e.preventDefault();
    for (const t of e.changedTouches) dedosBotao.delete(t.identifier);
    pintaBotoes(); envia();
  });

// ---------- area de toque: x/y e a posicao do dedo (-1 a 1), d diz se esta tocando ----------
const pad = $('pad'), ponto = $('ponto');
let dedoPad = null;
function tocaPad(t) {
  const r = pad.getBoundingClientRect(), meio = Math.min(r.width, r.height) / 2;
  let dx = (t.clientX - (r.left + r.width / 2)) / meio, dy = (t.clientY - (r.top + r.height / 2)) / meio;
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  x = dx; y = dy;
  ponto.style.display = 'block';
  ponto.style.left = (r.width / 2 + dx * meio) + 'px'; ponto.style.top = (r.height / 2 + dy * meio) + 'px';
  envia();
}
pad.addEventListener('touchstart', e => {
  e.preventDefault();
  if (dedoPad !== null) return;
  const t = e.changedTouches[0]; dedoPad = t.identifier; d = true; n++; tocaPad(t);
});
pad.addEventListener('touchmove', e => { for (const t of e.changedTouches) if (t.identifier === dedoPad) tocaPad(t); e.preventDefault(); });
for (const tipo of ['touchend', 'touchcancel'])
  pad.addEventListener(tipo, e => {
    for (const t of e.changedTouches) if (t.identifier === dedoPad) { dedoPad = null; d = false; ponto.style.display = 'none'; envia(); }
  });

function soltaTudo() {
  dedoPad = null; d = b = false; ponto.style.display = 'none';
  dedosBotao.clear();
  for (const id of ['btA', 'btB', 'btG']) $(id).classList.remove('ap');
  soltaJoystick();
}
// saiu da pagina (notificacao, ligacao, outra aba): solta tudo
document.addEventListener('visibilitychange', () => { if (document.hidden) soltaTudo(); });

// tela cheia e deitado: o navegador so deixa depois de um toque, entao tenta a cada toque enquanto nao estiver
document.addEventListener('touchend', () => {
  if (!j || document.fullscreenElement || aberto) return;
  document.documentElement.requestFullscreen?.({ navigationUI: 'hide' })
    .then(() => screen.orientation?.lock?.('landscape')).catch(() => {});
});

// ---------- escolha do lugar: nome salvo neste celular, a cor do lugar e se alguem ja esta nele ----------
let pedeNome = false;
const LUGARES = [['#2f7df6', 'azul'], ['#f0458f', 'rosa'], ['#35c26b', 'verde'], ['#ffc531', 'amarelo']];
function montaEscolha(ocupado = []) {
  const caixa = $('lugares');
  caixa.textContent = '';
  LUGARES.forEach(([c, palavra], k) => {
    const n = k + 1, salvoN = le('perfil' + n), nm = textoSeguro(salvoN?.nome, 10), tomado = ocupado[k] === true;
    const bt = document.createElement('button'), cara = document.createElement('i'), tx = document.createElement('span'), b = document.createElement('b'), sm = document.createElement('small');
    bt.style.setProperty('--c', c); bt.className = (k === 3 ? 'claro' : '') + (tomado ? ' ocupado' : '');      // ocupado fica apagado, mas tocavel (pode ser uma aba velha deste mesmo celular)
    cara.className = 'carinha'; cara.setAttribute('aria-hidden', 'true'); tx.className = 'tx';
    b.textContent = nm || 'Jogador ' + n; sm.textContent = tomado ? 'ocupado' : palavra;
    tx.append(b, sm); bt.append(cara, tx); bt.onclick = () => comecar(n);
    caixa.append(bt);
  });
}
montaEscolha();
fetch('/lugares', typeof AbortSignal.timeout === 'function' ? { signal: AbortSignal.timeout(2000) } : {}).then(r => r.json()).then(v => { if (!j && Array.isArray(v)) montaEscolha(v); }).catch(() => {});
function guardaNome(nm) {
  pedeNome = false; $('nomeIni').hidden = true;
  if (nm) { perfil.nome = nm; salvaPerfil(); treme([40, 30, 80]); } else guarda('semNome' + j, true);
}
$('bora').onclick = () => guardaNome(textoSeguro($('nomeNovo').value, 10));
$('nomeNovo').addEventListener('keydown', e => { if (e.key === 'Enter') guardaNome(textoSeguro($('nomeNovo').value, 10)); });
$('depois').onclick = () => guardaNome('');

const salvo = le('slot');
if (Number.isInteger(salvo) && salvo >= 1 && salvo <= 4) comecar(salvo);
</script>
